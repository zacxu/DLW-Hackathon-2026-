graph:
  place: "Singapore"
  network_type: "drive"
  center_lat: 1.3048
  center_lon: 103.8318
  dist_m: 1800
  simplify: true

env:
  goal_count: 2
  reward_time_scale_sec: 30.0
  completion_bonus: 80.0
  goal_reached_bonus: 25.0
  progress_reward_scale: 10.0
  revisit_penalty: 0.35
  revisit_penalty_cap: 8
  stagnation_penalty: 0.03
  unfinished_goal_penalty: 20.0
  max_steps_factor: 1.2
  max_steps_hard_cap: 140
  seed: 1

train:
  episodes: 400
  gamma: 0.98
  value_lr: 0.0007
  policy_lr: 0.0007
  batch_size: 128
  eval_every: 20
  checkpoint_every: 50
  temperature_start: 1.0
  temperature_end: 0.4
  epsilon_explore: 0.2
  eval_episodes: 30
  teacher_value_weight: 0.0
  teacher_goal_cost_weight: 4.0
  expert_action_prob_start: 0.9
  expert_action_prob_end: 0.15
  backtrack_penalty_strength: 0.8

model:
  value_hidden_dim: 128
  policy_hidden_dim: 128

output:
  run_dir: "artifacts/run_default"
